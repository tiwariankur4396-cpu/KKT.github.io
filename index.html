<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer</title>

  <style>
    body {
      font-family: Arial;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }

    #viewer {
      margin-top: 15px;
    }

    img, object {
      width: 100%;
      height: auto;
    }

    object {
      height: 500px;
    }
  </style>
</head>

<body>
  <div class="box">

    <!-- NO FORM -->
    <input id="search" placeholder="screenshot / photo / notes">

    <!-- type=button prevents navigation -->
    <button type="button" onclick="show()">Show</button>

    <div id="viewer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
