<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KKT File Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input {
      padding: 8px;
      margin: 5px 0;
      width: 200px;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
    }

    #searchSection {
      display: none;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login">
    <h2>Login</h2>

    <input id="name" type="text" placeholder="Enter Name">
    <br>

    <input id="roll" type="text" placeholder="Enter Roll No">
    <br>

    <button onclick="login()">Login</button>

    <p id="msg" style="color:red"></p>
  </div>

  <!-- SEARCH SECTION -->
  <div id="searchSection">
    <h2>Search Files</h2>

    <input id="searchBox" type="text" placeholder="Search (notes, photo, screenshot)">
    <br>

    <button onclick="search()">Search</button>

    <div id="result"></div>
  </div>

  <!-- JS FILE (MUST BE LAST) -->
  <script src="script.js"></script>

</body>
</html>
