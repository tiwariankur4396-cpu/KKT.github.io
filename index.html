

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="login">
            <h3>User Login</h3>
            <input type="text" id="name" placeholder="Enter Name" required>
            <input type="text" id="roll" placeholder="Enter Roll Number" required>
            <button onclick="login()">Login</button>
            <p id="msg" style="color:red; font-size: 13px;"></p>
            
            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                <p style="font-size: 12px; color: #666;">New Student?</p>
                <a href="register.html" style="color: #007bff; text-decoration: none; font-weight: bold; font-size: 14px;">Register here</a>
            </div>
        </div>

        <div id="searchSection" style="display:none;">
            <h3>File Search</h3>
            <p style="font-size: 12px; color: #888;">Type to see results instantly</p>
            <input type="text" id="searchBox" placeholder="Ex: cpexp4, screenshot, photo" oninput="search()">
            <div id="result" style="margin-top:20px;"></div>
            <br>
            <button onclick="location.reload()" style="background:#666;">Logout</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
