<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Search</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #searchSection { display: none; }

    img { max-width: 100%; height: auto; }
    iframe { width: 100%; height: 500px; border: none; }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="login">
    <h2>Login</h2>
    <input id="name" placeholder="Name">
    <input id="roll" placeholder="Roll Number">
    <button onclick="login()">Login</button>
    <p id="msg" style="color:red;text-align:center"></p>
  </div>

  <!-- SEARCH -->
  <div id="searchSection">
    <h2>Search File</h2>
    <input id="searchBox" placeholder="Enter keyword">
    <button onclick="search()">Search</button>
    <div id="result"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
