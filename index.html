<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KKT File Portal</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    #searchSection {
      display: none;
    }

    #result {
      margin-top: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    iframe {
      width: 100%;
      height: 500px;
      border: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <div id="login">
      <h2>Login</h2>
      <input id="name" placeholder="Name">
      <input id="roll" placeholder="Roll No">
      <button onclick="login()">Login</button>
      <p id="msg" style="color:red"></p>
    </div>

    <!-- SEARCH -->
    <div id="searchSection">
      <h2>Search File</h2>
      <input id="searchBox" placeholder="Type filename keyword">
      <button onclick="search()">Search</button>
      <div id="result"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
