<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        /* CSS INSIDE HTML */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .registration-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        h2 { margin-bottom: 8px; color: #333; }
        
        .subtitle { 
            color: #d9534f; 
            font-size: 14px; 
            margin-bottom: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .payment-box {
            background: #f8f9fa;
            border: 2px dashed #007bff;
            border-radius: 12px;
            margin: 20px 0;
            padding: 15px;
        }

        /* Small QR Code Style */
        .qr-small {
            width: 130px; /* Made it smaller as requested */
            height: 130px;
            margin: 10px auto;
            border-radius: 5px;
            display: block;
        }

        .small-text { 
            font-size: 11px; 
            color: #777; 
            margin: 5px 0;
        }

        .reg-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .reg-btn:hover {
            background-color: #218838;
        }

        .footer-link {
            margin-top: 20px;
            display: block;
            font-size: 13px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="registration-card">
        <h2>Register</h2>
        <p class="subtitle">Registration Fee: ₹50</p>
        
        <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
            <input type="text" name="StudentName" placeholder="Full Name" required>
            <input type="text" name="RollNumber" placeholder="Full Roll Number" required>
            <input type="email" name="Gmail" placeholder="Your Gmail Address" required>

            <div class="payment-box">
                <p style="font-size: 13px; margin: 0; font-weight: bold;">Step 1: Scan to Pay</p>
                
                <img src="Payment.jpg" alt="GPay QR Code" class="qr-small">
                
                <p class="small-text">Accepts GPay, PhonePe, & UPI</p>
            </div>

            <p class="small-text" style="color:#333;"><strong>Step 2:</strong> Submit after successful payment</p>
            <button type="submit" class="reg-btn">Register Now</button>
        </form>

        <a href="index.html" class="footer-link">← Back to Login</a>
    </div>

</body>
</html>
