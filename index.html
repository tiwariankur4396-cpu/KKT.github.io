<!DOCTYPE html>
<html>
<head>
    <title>Student Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
    <h2>Login</h2>

    <input type="text" id="name" placeholder="Login Name"><br>
    <input type="password" id="roll" placeholder="3 Digit Roll No"><br>

    <button onclick="login()">Login</button>
    <p id="msg"></p>
</div>

<div id="search" style="display:none;">
    <input type="text" id="searchBox" placeholder="Search file name">
    <button onclick="search()">Search</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
